<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookies - Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body class="login-page">

  <!-- ===== HEADER ===== -->
  <header class="landing-header login-header">
    <a href="index.html" class="site-logo">Bookies</a>
    <nav class="header-nav">
      <a href="index.html" class="nav-link-vintage">← Back to Home</a>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <main class="login-main register-main">

    <div class="video-bg-wrap">
      <video class="video-bg" autoplay muted loop playsinline>
        <source src="videos/Fireplace_Background.mp4" type="video/mp4">
      </video>
      <div class="video-overlay"></div>
    </div>

    <div class="login-card register-card">

      <!-- Brand -->
      <div class="login-brand">
        <span class="login-ornament">✦</span>
        <h1 class="login-title">Join Bookies</h1>
        <p class="login-subtitle">Create your reading account</p>
      </div>

      <!-- Divider -->
      <div class="login-rule">
        <span class="login-rule-line"></span>
        <span class="login-rule-dot">✦</span>
        <span class="login-rule-line"></span>
      </div>

      <!-- Form -->
      <form class="login-form" id="registerForm" action="/api/register" method="POST" novalidate>

        <!-- Username -->
        <div class="form-group">
          <label for="username" class="form-label-vintage">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-input-vintage"
            placeholder="your_username"
            autocomplete="username"
            required
          />
          <span class="field-error" id="usernameError"></span>
        </div>

        <!-- Nickname -->
        <div class="form-group">
          <label for="nickname" class="form-label-vintage">Nickname</label>
          <input
            type="text"
            id="nickname"
            name="nickname"
            class="form-input-vintage"
            placeholder="How others will see you"
            autocomplete="off"
            required
          />
          <span class="field-error" id="nicknameError"></span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label-vintage">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input-vintage"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <span class="field-error" id="emailError"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password" class="form-label-vintage">Password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input-vintage"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError"></span>
          <span class="field-hint">Min. 8 characters with at least one uppercase letter, one lowercase letter, and one number.</span>
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword" class="form-label-vintage">Confirm password</label>
          <div class="password-wrap">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              class="form-input-vintage"
              placeholder="••••••••"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-pw" id="toggleConfirmPw" aria-label="Show confirm password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="confirmPasswordError"></span>
        </div>

        <!-- Security Question 1 -->
        <div class="form-group">
          <label for="securityQ1" class="form-label-vintage">Security question 1</label>
          <select
            id="securityQ1"
            name="q1"
            class="form-input-vintage form-select-vintage"
            required
          >
            <option value="" disabled selected>Choose a question…</option>
          </select>
          <span class="field-error" id="securityQ1Error"></span>
        </div>

        <!-- Answer 1 -->
        <div class="form-group">
          <label for="securityA1" class="form-label-vintage">Your answer</label>
          <input
            type="text"
            id="securityA1"
            name="a1"
            class="form-input-vintage"
            placeholder="Your answer…"
            autocomplete="off"
            required
          />
          <span class="field-error" id="securityA1Error"></span>
        </div>

        <!-- Security Question 2 -->
        <div class="form-group">
          <label for="securityQ2" class="form-label-vintage">Security question 2</label>
          <select
            id="securityQ2"
            name="q2"
            class="form-input-vintage form-select-vintage"
            required
          >
            <option value="" disabled selected>Choose a different question…</option>
          </select>
          <span class="field-error" id="securityQ2Error"></span>
        </div>

        <!-- Answer 2 -->
        <div class="form-group">
          <label for="securityA2" class="form-label-vintage">Your answer</label>
          <input
            type="text"
            id="securityA2"
            name="a2"
            class="form-input-vintage"
            placeholder="Your answer…"
            autocomplete="off"
            required
          />
          <span class="field-error" id="securityA2Error"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-vintage btn-full" id="submitBtn">
          Create Account
        </button>

        <!-- General error -->
        <p class="form-error-general" id="generalError"></p>

      </form>

      <!-- Sign in link -->
      <p class="register-prompt">
        Already have an account?
        <a href="login.html" class="register-link">Sign in →</a>
      </p>

    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/register.js"></script>
  <script>initFooter();</script>
</body>
</html>
