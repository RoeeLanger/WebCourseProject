<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookies — Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

  <!-- ===== HEADER ===== -->
  <header class="landing-header login-header">
    <a href="index.html" class="site-logo">Bookies</a>
    <nav class="header-nav">
      <a href="index.html" class="nav-link-vintage">← Back to Home</a>
    </nav>
  </header>

  <!-- ===== VIDEO BACKGROUND ===== -->
  <div class="video-bg-wrap">
    <video class="video-bg" autoplay muted loop playsinline>
      <source src="videos/cozy.mp4" type="video/mp4">
    </video>
    <!-- Dark + warm tinted overlay so the card stays readable -->
    <div class="video-overlay"></div>
  </div>

  <!-- ===== MAIN ===== -->
  <main class="login-main">

    <div class="login-card">

      <!-- Brand -->
      <div class="login-brand">
        <span class="login-ornament">✦</span>
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to your reading clubs</p>
      </div>

      <!-- Divider -->
      <div class="login-rule">
        <span class="login-rule-line"></span>
        <span class="login-rule-dot">✦</span>
        <span class="login-rule-line"></span>
      </div>

      <!-- Form -->
      <form class="login-form" id="loginForm" novalidate>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label-vintage">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input-vintage"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <span class="field-error" id="emailError"></span>
        </div>

        <!-- Password -->
        <div class="form-group">
          <div class="password-label-row">
            <label for="password" class="form-label-vintage">Password</label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input-vintage"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-vintage btn-full" id="submitBtn">
          Sign In
        </button>

        <!-- General error -->
        <p class="form-error-general" id="generalError"></p>

      </form>

      <!-- Register link -->
      <p class="register-prompt">
        New to Bookies?
        <a href="register.html" class="register-link">Create an account →</a>
      </p>

    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="login-footer">
    <p>© 2026 Bookies — All rights reserved</p>
  </footer>

  <script src="js/login.js"></script>
</body>
</html>
