<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bookies — Profile</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/profile.css">
</head>

<body class="profile-page">

  <!-- ===== HEADER ===== -->
  <header class="landing-header login-header">

    <a href="index.html" class="site-logo">
      Bookies
    </a>

    <nav class="header-nav">

      <a href="#" class="nav-link-vintage">
        My Clubs
      </a>

      <a href="#" class="nav-link-vintage">
        Calendar
      </a>

      <a href="#" class="nav-link-vintage" id="logout-btn">
        Logout
      </a>

    </nav>

  </header>

  <!-- ===== MAIN ===== -->
  <main class="profile-main">

    <!-- VIDEO SECTION -->
    <section class="profile-video-section">

      <video
        autoplay
        muted
        playsinline
        class="profile-video"
        id="heroVideo"
      >
        <source src="videos/272756_tiny.mp4" type="video/mp4">
      </video>

      <div class="profile-video-overlay"></div>

      <div class="profile-video-text">

        <p class="profile-eyebrow">
          Your Reading Space
        </p>

        <h1 class="profile-name" id="profileName">
          Welcome back
        </h1>

        <p class="profile-subtitle" id="profileSubtitle">
          No user data available yet.
        </p>

      </div>

    </section>

    <!-- PROFILE STATS -->
    <section class="glass-section">

      <div class="profile-stats">

        <div class="stat-item">

          <span class="stat-number" id="clubsCount">
            0
          </span>

          <span class="stat-label">
            Clubs
          </span>

        </div>

        <div class="stat-item">

          <span class="stat-number" id="managedCount">
            0
          </span>

          <span class="stat-label">
            Managed
          </span>

        </div>

        <div class="stat-item">

          <span class="stat-number" id="meetingsCount">
            0
          </span>

          <span class="stat-label">
            Meetings
          </span>

        </div>

      </div>

    </section>

    <!-- CLUBS -->
    <section class="profile-section">

      <div class="section-header">

        <h2 class="section-title">
          Your Clubs
        </h2>

      </div>

      <div class="clubs-grid" id="clubsGrid"></div>

    </section>

    <!-- MEETINGS -->
    <section class="profile-section">

      <div class="section-header">

        <h2 class="section-title">
          Upcoming Meetings
        </h2>

      </div>

      <div class="meetings-list" id="meetingsList"></div>

    </section>

  </main>

  <script src="js/profile.js"></script>

  <script>

    const heroVideo =
      document.getElementById("heroVideo");

    heroVideo.addEventListener("ended", () => {

      setTimeout(() => {

        heroVideo.currentTime = 0;

        heroVideo.play();

      }, 10000);

    });

  </script>

</body>
</html>
